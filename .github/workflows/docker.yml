name: Production CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Docker Image
        run: |
          docker build -t brijesh112007/my_api_project-backend:latest .

      - name: Push Backend Docker Image
        run: |  
          docker push brijesh112007/my_api_project-backend:latest

      - name: Build Worker Docker Image
        run: |
          docker build -t brijesh112007/my_api_project-worker:latest .

      - name: Push Worker Docker Image
        run: |
          docker push brijesh112007/my_api_project-worker:latest