version: '3.8'

services:

  # ---------------- BACKEND ----------------
  backend:
    build: .
    container_name: uptime_backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongo
    command: npm start
    restart: always


  # ---------------- WORKER ----------------
  worker:
    build: .
    container_name: uptime_worker
    env_file:
      - .env
    depends_on:
      - mongo
    command: node worker.js
    restart: always


  # ---------------- MONGO DB ----------------
  mongo:
    image: mongo
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db


  # ---------------- MONGO EXPRESS (optional UI) ----------------
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
    depends_on:
      - mongo


  # ---------------- FRONTEND (STATIC FILES) ----------------
  frontend:
    image: nginx:alpine
    container_name: uptime_frontend
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html
    restart: always


# ---------------- VOLUMES ----------------
volumes:
  mongo_data: