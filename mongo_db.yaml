version: '3.8'

services:

  backend:
    build: .
    container_name: uptime_backend
    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - mongo

    command: npm start

    volumes:
      - "C:/Users/brije/OneDrive/Desktop/my_project:/app"
      - /app/node_modules


  worker:
    build: .
    container_name: uptime_worker

    env_file:
      - .env

    depends_on:
      - mongo

    command: node worker.js

    volumes:
      - "C:/Users/brije/OneDrive/Desktop/my_project:/app"
      - /app/node_modules


  mongo:
    image: mongo
    container_name: mongo

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

    volumes:
      - mongo_data:/data/db


  mongo-express:
    image: mongo-express
    container_name: mongo-express

    restart: always

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin

    depends_on:
      - mongo


volumes:
  mongo_data: